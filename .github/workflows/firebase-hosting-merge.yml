name: Deploy to Firebase on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Autenticación oficial utilizando tu secreto de GitHub
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APCO_TOOLS }}

      # Instalación de dependencias y compilación
      - name: Install and Build Frontend & Functions
        run: |
          npm install -g firebase-tools
          npm ci
          npm run build
          cd functions && npm ci && npm run build && cd ..

      # Despliegue conjunto
      - name: Deploy to Firebase
        run: firebase deploy --only hosting,functions
