name: Deploy to Firebase on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Autenticación oficial utilizando tu secreto de GitHub
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APCO_TOOLS }}

      # Instalamos la herramienta de Firebase de forma global en la máquina de GitHub
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Instalamos las dependencias de tu proyecto e iniciamos la compilación de Nuxt
      - name: Install Root Dependencies & Build
        run: |
          npm ci
          npm run build


      # Desplegamos tanto el frontend (Hosting) como la función de servidor generada por Nuxt (.output/server)
      - name: Deploy to Firebase
        run: npx firebase-tools deploy
