name: Deploy to Firebase on Merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APCO_TOOLS }}
      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools
      - name: Install root dependencies
        run: npm ci
      - name: Build Nuxt (runs postbuild.js automatically)
        run: npm run build
        env:
          NODE_ENV: production
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions
      - name: Deployment Summary
        if: success()
        run: echo "Deploy exitoso"
      - name: Deployment Failed
        if: failure()
        run: echo "Deploy falló"